<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAF6F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dlooda TKBD">
  <link rel="manifest" href="manifest.json">
  <title>Dlooda TKBD · 视频管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <div class="page-header__left">
          <h1 class="page-header__title">视频管理</h1>
          <p class="page-header__subtitle">视频数据 & 深度效果分析</p>
        </div>
      </div>

      <!-- 视图切换（与其它模块一致） -->
      <div class="view-tabs" id="video-view-tabs">
        <button class="view-tab active" data-view="list">列表</button>
        <button class="view-tab" data-view="analysis">分析</button>
        <button class="view-tab" data-view="material">素材看板</button>
      </div>

      <!-- 搜索 -->
      <div class="search-bar" style="margin-bottom:12px;">
        <input type="text" class="input" id="video-search" placeholder="搜索达人 / SKU / 品类...">
      </div>

      <!-- 时间+SKU 筛选栏（列表/分析/素材三视图共用） -->
      <div id="video-list-filter-bar" style="margin-bottom:12px;"></div>

      <!-- 排序 -->
      <div id="sort-section" style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
        <span style="font-size:12px;color:var(--text-3);flex-shrink:0;">排序：</span>
        <select class="filter-select" id="sort-select" style="flex:0 0 auto;min-width:140px;">
          <option value="date">按时间</option>
          <option value="creator">按达人</option>
          <option value="sku">按 SKU</option>
        </select>
      </div>

      <!-- 分析视图 -->
      <div id="video-analysis" style="display:none;">
        <!-- 分析内容 -->
        <div id="video-analysis-content"></div>
      </div>

      <!-- 素材看板视图 -->
      <div id="video-material" style="display:none;">
        <div id="video-material-content"></div>
      </div>

      <!-- 视频列表 -->
      <div id="video-list"></div>
    </main>
    <nav class="bottom-nav"></nav>
  </div>
  <script src="js/real-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/video.js"></script>
</body>
</html>
