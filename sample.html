<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAF6F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dlooda TKBD">
  <link rel="manifest" href="manifest.json">
  <title>Dlooda TKBD · 样品追踪</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <div class="page-header__left">
          <h1 class="page-header__title">样品追踪</h1>
          <p class="page-header__subtitle">SKU筛选 · 数据看板 · 月报支撑</p>
        </div>
        <div class="page-header__actions" style="display:flex;gap:6px;">
          <button class="btn btn--ghost btn--sm active" id="btn-view-list">列表</button>
          <button class="btn btn--ghost btn--sm" id="btn-view-dashboard">看板</button>
        </div>
      </div>

      <!-- 状态统计 -->
      <div class="stat-grid" id="sample-stats"></div>

      <!-- 时间筛选 -->
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <input type="date" class="input" id="date-start" style="width:auto;font-size:12px;padding:6px 8px;">
        <span style="font-size:12px;color:var(--text-3);">至</span>
        <input type="date" class="input" id="date-end" style="width:auto;font-size:12px;padding:6px 8px;">
        <button class="btn btn--ghost btn--sm" id="btn-quick-month" style="font-size:11px;">本月</button>
        <button class="btn btn--ghost btn--sm" id="btn-clear-date" style="font-size:11px;">清除</button>
      </div>

      <!-- SKU 筛选 -->
      <div class="filter-tabs" id="sku-tabs" style="margin-bottom:8px;"></div>

      <!-- 搜索 -->
      <div class="search-bar" style="margin-bottom:12px;">
        <input type="text" class="input" id="sample-search" placeholder="搜索达人 / SKU / 备注...">
      </div>

      <!-- 状态筛选 -->
      <div class="filter-tabs" id="filter-tabs"></div>

      <!-- 看板视图 -->
      <div id="sample-dashboard" style="display:none;"></div>

      <!-- 列表视图 -->
      <div class="creator-list" id="sample-list"></div>
    </main>
    <nav class="bottom-nav"></nav>
  </div>
  <script src="js/real-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sample.js"></script>
</body>
</html>
