<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAF6F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dlooda TKBD">
  <link rel="manifest" href="manifest.json">
  <title>Dlooda TKBD · 数据看板</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .analysis-tabs { display:flex; gap:8px; overflow-x:auto; padding:10px 4px 14px; margin:0 -4px 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch; position:sticky; top:0; z-index:50; background:var(--bg-1); border-bottom:1px solid var(--border-1); }
    .analysis-tabs::-webkit-scrollbar { display:none; }
    .analysis-tab { flex:0 0 auto; padding:8px 16px; border-radius:var(--r-full); background:#fff; color:var(--text-2); font-size:12px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; border:1px solid var(--border-1); box-shadow:var(--shadow-xs); }
    .analysis-tab.active { background:var(--pink-500); color:#fff; border-color:var(--pink-500); box-shadow:var(--shadow-sm); }
    .analysis-tab:hover { background:var(--pink-50); color:var(--pink-600); border-color:var(--pink-300); }
    .analysis-tab.active:hover { background:var(--pink-600); color:#fff; border-color:var(--pink-600); }
    .section.tab-hidden { display:none !important; }
    .bar-row { display:flex;align-items:center;gap:10px;margin-bottom:8px; }
    .bar-label { width:60px;font-size:11px;font-weight:600;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .bar-track { flex:1;height:16px;background:var(--bg-pink-soft);border-radius:8px;overflow:hidden;position:relative; }
    .bar-fill { height:100%;border-radius:8px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px; }
    .bar-pct { font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15); }
    .bar-count { width:90px;text-align:right;font-size:11px;color:var(--text-3); }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <div class="page-header__left">
          <h1 class="page-header__title">数据看板</h1>
          <p class="page-header__subtitle">达人画像 · 语言 · 开发效果 · 寄样趋势 · 产品出单率 · 履约率 · 视频出单 · 复投</p>
        </div>
      </div>

      <!-- 筛选栏 -->
      <div id="dashboard-filter-bar"></div>

      <!-- 顶部分析标签页 -->
      <div class="analysis-tabs" id="analysis-tabs">
        <button class="analysis-tab active" data-target="section-persona">达人画像分析</button>
        <button class="analysis-tab" data-target="section-language">语言分布</button>
        <button class="analysis-tab" data-target="section-dev">开发效果分析</button>
        <button class="analysis-tab" data-target="section-trend">寄样趋势分析</button>
        <button class="analysis-tab" data-target="section-product">产品分析</button>
        <button class="analysis-tab" data-target="section-fulfill">履约率分析</button>
        <button class="analysis-tab" data-target="section-video">视频质量分析</button>
        <button class="analysis-tab" data-target="section-reinvest">复投分析</button>
      </div>

      <!-- 1. 达人画像分析 -->
      <div class="section" id="section-persona">
        <div class="section__header"><h2 class="section__title">达人画像分析</h2></div>
        <div id="persona-analysis"></div>
      </div>

      <!-- 2. 语言分布 -->
      <div class="section" id="section-language">
        <div class="section__header"><h2 class="section__title">语言分布</h2></div>
        <div id="language-distribution"></div>
      </div>

      <!-- 3. 开发效果分析 -->
      <div class="section" id="section-dev">
        <div class="section__header"><h2 class="section__title">开发效果分析</h2></div>
        <div id="dev-effect"></div>
      </div>

      <!-- 4. 寄样趋势分析 -->
      <div class="section" id="section-trend">
        <div class="section__header"><h2 class="section__title">寄样趋势分析</h2></div>
        <div id="trend-analysis"></div>
      </div>

      <!-- 5. 产品分析 -->
      <div class="section" id="section-product">
        <div class="section__header"><h2 class="section__title">产品分析</h2></div>
        <div id="product-analysis"></div>
      </div>

      <!-- 6. 履约率分析 -->
      <div class="section" id="section-fulfill">
        <div class="section__header"><h2 class="section__title">履约率分析</h2></div>
        <div id="fulfill-method"></div>
      </div>

      <!-- 7. 视频质量分析 -->
      <div class="section" id="section-video">
        <div class="section__header"><h2 class="section__title">视频质量分析</h2></div>
        <div id="video-quality"></div>
      </div>

      <!-- 8. 复投分析 -->
      <div class="section" id="section-reinvest">
        <div class="section__header"><h2 class="section__title">复投分析</h2></div>
        <div id="reinvest-analysis"></div>
      </div>
    </main>
    <nav class="bottom-nav"></nav>
  </div>
  <script src="js/real-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
