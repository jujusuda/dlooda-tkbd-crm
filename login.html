<!DOCTYPE html>
<html lang="zh-CN" data-auth-page="login">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAF6F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dlooda TKBD">
  <link rel="manifest" href="manifest.json">
  <title>Dlooda TKBD · 登录</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 本页标记：守卫三重判定之一，不受 URL 重写影响
    window.__DLOODA_LOGIN_PAGE__ = true;
    // Cloudflare Pages 会把 /login.html 308 成 /login（去掉扩展名）。把地址栏补回 .html，
    // 让「只认 login.html」的旧版守卫也能识别本页 —— 即使浏览器还留着旧缓存也不会再循环。
    try {
      if (/^\/login\/?$/.test(location.pathname)) {
        history.replaceState(null, '', '/login.html' + location.search + location.hash);
      }
    } catch (e) {}
  </script>
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg, #F7F8FA);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid var(--border-1, #E4E7EC);
      border-radius: 14px;
      padding: 32px 28px 28px;
      box-shadow: 0 8px 28px rgba(24, 34, 47, .07);
    }
    .login-brand {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-1, #243447);
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }
    .login-brand span { color: var(--pink-500, #D4738F); }
    .login-sub {
      font-size: 12px;
      color: var(--text-3, #9299A3);
      margin-bottom: 26px;
      line-height: 1.6;
    }
    .login-field { margin-bottom: 16px; }
    .login-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2, #5F6772);
      margin-bottom: 6px;
    }
    .login-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid var(--border-1, #E4E7EC);
      border-radius: 8px;
      background: #fff;
      color: var(--text-1, #243447);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .login-field input:focus { border-color: var(--pink-400, #D98AA5); }
    .login-error {
      display: none;
      margin: 0 0 14px;
      padding: 9px 11px;
      border-radius: 8px;
      background: #FDECEC;
      border: 1px solid #F3C6C6;
      color: #B84A4A;
      font-size: 12px;
      line-height: 1.5;
    }
    .login-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--pink-500, #C96A8B);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .login-btn:hover { opacity: .92; }
    .login-btn:disabled { opacity: .6; cursor: wait; }
    .login-note {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-1, #E4E7EC);
      font-size: 11px;
      color: var(--text-3, #9299A3);
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">Dlooda <span>TKBD</span></div>
      <div class="login-sub">达人商务工作台 · 内部使用，请先登录</div>

      <form id="login-form" autocomplete="off">
        <div class="login-field">
          <label for="login-username">账号</label>
          <input type="text" id="login-username" name="username" placeholder="请输入账号" required autofocus>
        </div>
        <div class="login-field">
          <label for="login-password">密码</label>
          <input type="password" id="login-password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="login-error" id="login-error" role="alert"></div>
        <button type="submit" class="login-btn" id="login-submit">登录</button>
      </form>

      <div class="login-note">
        账号由管理员在配置中统一维护。本登录为基础门禁，数据保密请后续接入后端鉴权。
      </div>
    </div>
  </div>

  <script>
    (function () {
      var Auth = window.DloodaAuth;
      var form = document.getElementById('login-form');
      var errBox = document.getElementById('login-error');
      var submit = document.getElementById('login-submit');

      function redirectTarget() {
        var m = location.search.match(/[?&]redirect=([^&]*)/);
        var raw = '';
        if (m) { try { raw = decodeURIComponent(m[1]); } catch (e) { raw = m[1]; } }
        // 只允许站内相对路径；登录页自身 / 已嵌套 redirect（死循环产物）一律回首页
        if (!raw || /^https?:/i.test(raw) || /^\/\//.test(raw) ||
            /^login(\.html?)?([?#&]|$)/i.test(raw) || /[?&]redirect=/i.test(raw)) {
          return 'index.html';
        }
        // Cloudflare pretty URLs 会把 /xxx.html 308 成 /xxx；本地静态服务仍需要 .html。
        // 只拆「页面名」补扩展名，避免把 "?reset=1" 这种纯查询串变成 ".html?reset=1"。
        var mm = raw.match(/^([^?#]*)(.*)$/);
        var page = (mm[1] || '').replace(/^\/+/, '');
        var suffix = mm[2] || '';
        if (!page || /^index$/i.test(page)) page = 'index.html';
        else if (!/\./.test(page)) page += '.html';
        return page + suffix;
      }

      // 已登录直接回原页
      if (Auth && Auth.isLoggedIn()) {
        location.replace(redirectTarget());
        return;
      }

      function showError(msg) {
        errBox.textContent = msg;
        errBox.style.display = 'block';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errBox.style.display = 'none';
        var username = document.getElementById('login-username').value.trim();
        var password = document.getElementById('login-password').value;
        if (!username || !password) { showError('请输入账号和密码'); return; }
        if (!Auth) { showError('登录模块未加载，请刷新页面重试'); return; }

        submit.disabled = true;
        submit.textContent = '登录中…';
        Auth.verify(username, password).then(function (res) {
          if (!res || !res.ok) {
            showError((res && res.message) || '账号或密码错误');
            submit.disabled = false;
            submit.textContent = '登录';
            return;
          }
          Auth.login(username, res.display);
          location.replace(redirectTarget());
        }).catch(function () {
          showError('登录失败，请稍后再试');
          submit.disabled = false;
          submit.textContent = '登录';
        });
      });
    })();
  </script>
</body>
</html>
