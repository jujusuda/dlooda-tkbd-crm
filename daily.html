<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAF6F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dlooda TKBD">
  <link rel="manifest" href="manifest.json">
  <title>Dlooda TKBD · 日报生成</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <div class="page-header__left">
          <h1 class="page-header__title">日报生成</h1>
          <p class="page-header__subtitle" id="daily-date-subtitle">今日工作汇总</p>
        </div>
        <div class="page-header__actions">
          <button class="btn btn--primary btn--sm" id="btn-copy-daily">复制日报</button>
        </div>
      </div>

      <!-- 日期选择 -->
      <div class="filter-bar" style="margin-bottom:16px;">
        <input type="date" class="filter-date" id="daily-date-input">
        <button class="filter-btn" id="btn-daily-today">今天</button>
        <button class="filter-btn" id="btn-daily-prev">前一天</button>
        <button class="filter-btn" id="btn-daily-next">后一天</button>
      </div>

      <!-- 今日工作概览 -->
      <div class="section">
        <div class="section__header">
          <h2 class="section__title">今日工作概览</h2>
        </div>
        <div class="stat-grid" id="today-stats"></div>
      </div>

      <!-- 今日寄样SKU分布 -->
      <div class="section" id="today-sku-section">
        <div class="section__header">
          <h2 class="section__title">今日寄样 SKU 分布</h2>
        </div>
        <div class="card">
          <div id="today-sku-dist"></div>
        </div>
      </div>

      <!-- 今日寄样明细 -->
      <div class="section" id="today-samples-section">
        <div class="section__header">
          <h2 class="section__title">今日寄样明细</h2>
          <span class="section__hint">自动按当天寄样量生成</span>
        </div>
        <div class="card">
          <div id="today-samples-list"></div>
        </div>
      </div>

      <!-- 今日开发达人 -->
      <div class="section" id="today-new-creators-section">
        <div class="section__header">
          <h2 class="section__title">今日开发达人</h2>
          <span class="section__hint">首次合作的达人</span>
        </div>
        <div class="card">
          <div id="today-new-creators"></div>
        </div>
      </div>

      <!-- 整体数据对比 -->
      <div class="section">
        <div class="section__header">
          <h2 class="section__title">整体数据</h2>
        </div>
        <div class="stat-grid" id="overall-stats"></div>
      </div>

      <!-- 补充说明 -->
      <div class="section">
        <div class="card">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">补充说明（可选）</label>
            <textarea class="textarea" id="daily-notes" placeholder="今天有什么特别的事情需要补充？如：某达人反馈、突发情况、次日计划..." style="min-height:60px;"></textarea>
            <div class="form-hint">输入后日报预览会实时更新</div>
          </div>
        </div>
      </div>

      <!-- 日报预览 -->
      <div class="section">
        <div class="section__header">
          <h2 class="section__title">日报预览</h2>
        </div>
        <div class="card">
          <pre id="daily-preview" style="font-family:inherit;font-size:13px;line-height:1.8;color:var(--text-1);white-space:pre-wrap;word-break:break-word;margin:0;"></pre>
        </div>
      </div>
    </main>
    <nav class="bottom-nav"></nav>
  </div>
  <script src="js/real-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/daily.js"></script>
</body>
</html>
