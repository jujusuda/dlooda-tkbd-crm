<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAF6F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dlooda TKBD">
  <link rel="manifest" href="manifest.json">
  <title>Dlooda TKBD · 日报生成</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <div class="page-header__left">
          <h1 class="page-header__title">日报生成</h1>
          <p class="page-header__subtitle" id="daily-date-subtitle">今日工作汇总</p>
        </div>
        <div class="page-header__actions">
          <button class="btn btn--primary btn--sm" id="btn-copy-daily">复制日报</button>
        </div>
      </div>

      <!-- 日期选择 -->
      <div class="filter-bar" style="margin-bottom:16px;">
        <input type="date" class="filter-date" id="daily-date-input">
        <button class="filter-btn" id="btn-daily-today">今天</button>
        <button class="filter-btn" id="btn-daily-prev">前一天</button>
        <button class="filter-btn" id="btn-daily-next">后一天</button>
      </div>

      <!-- 今日工作完成（可手动调整） -->
      <div class="section">
        <div class="section__header">
          <h2 class="section__title">今日工作完成</h2>
          <span class="section__hint">系统统计可手动覆盖，按日期保存</span>
        </div>
        <div class="card">
          <div id="today-stats"></div>
          <div style="margin-top:12px;text-align:right;">
            <button class="filter-btn" id="btn-reset-stats">重置为系统统计</button>
          </div>
        </div>
      </div>

      <!-- 今日寄样SKU分布 -->
      <div class="section" id="today-sku-section">
        <div class="section__header">
          <h2 class="section__title">今日寄样 SKU 分布</h2>
        </div>
        <div class="card">
          <div id="today-sku-dist"></div>
        </div>
      </div>

      <!-- 今日寄样明细 -->
      <div class="section" id="today-samples-section">
        <div class="section__header">
          <h2 class="section__title">今日寄样明细</h2>
          <span class="section__hint">自动按当天寄样量生成</span>
        </div>
        <div class="card">
          <div id="today-samples-list"></div>
        </div>
      </div>

      <!-- 今日开发达人 -->
      <div class="section" id="today-new-creators-section">
        <div class="section__header">
          <h2 class="section__title">今日开发达人</h2>
          <span class="section__hint">首次合作的达人</span>
        </div>
        <div class="card">
          <div id="today-new-creators"></div>
        </div>
      </div>

      <!-- 整体数据对比 -->
      <div class="section">
        <div class="section__header">
          <h2 class="section__title">整体数据</h2>
        </div>
        <div class="stat-grid" id="overall-stats"></div>
      </div>

      <!-- 补充说明（可增删改的条目列表） -->
      <div class="section">
        <div class="card">
          <div class="form-group" style="margin-bottom:12px;">
            <label class="form-label">补充说明（可逐条增删改）</label>
            <div style="display:flex;gap:8px;">
              <input type="text" class="filter-input" id="daily-note-input" placeholder="输入一条补充说明，回车或点添加..." style="flex:1;">
              <button class="btn btn--primary btn--sm" id="btn-add-note">添加</button>
            </div>
            <div class="form-hint">每条独立保存，可编辑 / 删除，自动进入日报预览</div>
          </div>
          <div id="daily-notes-list"></div>
        </div>
      </div>

      <!-- 日报预览 -->
      <div class="section">
        <div class="section__header">
          <h2 class="section__title">日报预览</h2>
        </div>
        <div class="card">
          <pre id="daily-preview" style="font-family:inherit;font-size:13px;line-height:1.8;color:var(--text-1);white-space:pre-wrap;word-break:break-word;margin:0;"></pre>
        </div>
      </div>
    </main>
    <nav class="bottom-nav"></nav>
  </div>
  <script src="js/real-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/daily.js"></script>
</body>
</html>
