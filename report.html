<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAF6F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dlooda TKBD">
  <link rel="manifest" href="manifest.json">
  <title>Dlooda TKBD · 数据复盘</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .bar-row { display:flex;align-items:center;gap:10px;margin-bottom:8px; }
    .bar-label { width:60px;font-size:11px;font-weight:600;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .bar-track { flex:1;height:14px;background:var(--bg-pink-soft);border-radius:7px;overflow:hidden;position:relative; }
    .bar-fill { height:100%;border-radius:7px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px; }
    .bar-pct { font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15); }
    .bar-count { width:70px;text-align:right;font-size:11px;color:var(--text-3); }
    .change-up { color:var(--c-success); }
    .change-down { color:var(--c-danger); }
    .change-flat { color:var(--text-3); }
    .attribution-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:12px; }
    @media (max-width: 640px) { .attribution-grid { grid-template-columns:1fr; } }
    .dim-card { background:#fff;border:1px solid var(--border-1);border-radius:12px;padding:12px; }
    .dim-title { font-size:13px;font-weight:700;color:var(--pink-600);margin-bottom:10px; }
    .trend-line { fill:none;stroke-width:2;stroke-linejoin:round; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <div class="page-header__left">
          <h1 class="page-header__title">数据复盘</h1>
          <p class="page-header__subtitle">SKU 出单率趋势 · 升降归因 · 通过率</p>
        </div>
      </div>

      <!-- 视图切换 -->
      <div class="view-tabs" id="report-view-tabs">
        <button class="view-tab active" data-view="trend">SKU 出单率趋势</button>
        <button class="view-tab" data-view="attribution">升降归因</button>
        <button class="view-tab" data-view="passrate">通过率</button>
      </div>

      <!-- 筛选栏 -->
      <div id="report-filter-bar"></div>

      <!-- ========== 视图1: SKU 出单率趋势 ========== -->
      <div id="view-trend" class="view-panel">
        <div class="stat-grid" id="trend-metrics"></div>
        <div class="section">
          <div class="section__header"><h2 class="section__title">SKU 月度出单率趋势</h2></div>
          <div class="card"><div id="sku-trend-chart"></div></div>
        </div>
        <div class="section">
          <div class="section__header"><h2 class="section__title">出单率升降榜</h2></div>
          <div class="card"><div id="sku-change-ranking"></div></div>
        </div>
      </div>

      <!-- ========== 视图2: 升降归因 ========== -->
      <div id="view-attribution" class="view-panel" style="display:none;">
        <div class="card" style="margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 12px 0;">
            <label style="font-size:13px;font-weight:600;color:var(--text-2);">选择 SKU：</label>
            <select id="attr-sku-select" style="padding:8px 12px;border:1px solid var(--border-1);border-radius:8px;background:#fff;font-size:13px;color:var(--text-1);min-width:160px;"></select>
          </div>
          <div class="attr-compare" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;">
            <span style="font-size:13px;font-weight:600;color:var(--text-2);">对比区间：</span>
            <div class="attr-range" data-range="A" style="display:flex;align-items:center;gap:4px;">
              <input type="date" class="attr-start" style="padding:7px 10px;border:1px solid var(--border-1);border-radius:8px;background:#fff;font-size:13px;color:var(--text-1);" />
              <span style="color:var(--text-3);font-size:12px;">~</span>
              <input type="date" class="attr-end" style="padding:7px 10px;border:1px solid var(--border-1);border-radius:8px;background:#fff;font-size:13px;color:var(--text-1);" />
            </div>
            <span style="color:var(--text-3);font-size:12px;">对比</span>
            <div class="attr-range" data-range="B" style="display:flex;align-items:center;gap:4px;">
              <input type="date" class="attr-start" style="padding:7px 10px;border:1px solid var(--border-1);border-radius:8px;background:#fff;font-size:13px;color:var(--text-1);" />
              <span style="color:var(--text-3);font-size:12px;">~</span>
              <input type="date" class="attr-end" style="padding:7px 10px;border:1px solid var(--border-1);border-radius:8px;background:#fff;font-size:13px;color:var(--text-1);" />
            </div>
            <button class="filter-btn" id="attr-apply">应用对比</button>
            <button class="filter-btn" data-preset="mom">环比</button>
            <button class="filter-btn" data-preset="yoy">同比</button>
            <button class="filter-btn" data-preset="qoq">季度环比</button>
            <button class="filter-btn filter-btn--clear" id="attr-reset">恢复近两月</button>
            <span style="font-size:12px;color:var(--text-3);">默认对比最近两个月；也可任意选两个时间段</span>
          </div>
        </div>
        <div id="attribution-content"></div>
      </div>

      <!-- ========== 视图3: 通过率 ========== -->
      <div id="view-passrate" class="view-panel" style="display:none;">
        <div class="stat-grid" id="passrate-metrics"></div>
        <div class="section">
          <div class="section__header"><h2 class="section__title">月度通过率趋势</h2></div>
          <div class="card"><div id="passrate-trend-chart"></div></div>
        </div>
        <div class="section">
          <div class="section__header"><h2 class="section__title">SKU 通过率明细</h2></div>
          <div class="card"><div id="passrate-sku-table"></div></div>
        </div>
      </div>
    </main>
    <nav class="bottom-nav"></nav>
  </div>
  <script src="js/real-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
