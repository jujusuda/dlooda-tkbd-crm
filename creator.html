<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAF6F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dlooda TKBD">
  <link rel="manifest" href="manifest.json">
  <title>Dlooda TKBD · 达人管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>

    <main class="main">
      <div class="page-header">
        <div class="page-header__left">
          <h1 class="page-header__title">达人管理</h1>
          <p class="page-header__subtitle">共 <span id="creator-count">0</span> 位达人</p>
        </div>
        <div class="page-header__actions">
          <a href="ai-assistant.html" class="btn btn--primary btn--sm">+ AI 分析新达人</a>
        </div>
      </div>

      <!-- 搜索栏 -->
      <div class="search-bar">
        <span class="search-bar__icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        </span>
        <input type="text" class="input" id="creator-search" placeholder="搜索达人昵称、类型、备注...">
      </div>

      <!-- 筛选 tabs -->
      <div class="filter-tabs" id="filter-tabs"></div>

      <!-- 达人列表 -->
      <div class="creator-list" id="creator-list"></div>
    </main>

    <nav class="bottom-nav"></nav>
  </div>

  <script src="js/real-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/creator.js"></script>
</body>
</html>
